server {
  # HTTP - Redirect to HTTPS
  listen 80;
  server_name careeroad.pro www.careeroad.pro;
  
  # Redirect all HTTP traffic to HTTPS
  return 301 https://$host$request_uri;
}

server {
  # HTTPS
  listen 443 ssl http2;
  server_name careeroad.pro www.careeroad.pro;

  # SSL Certificate paths (mount these via docker-compose volumes)
  ssl_certificate /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;

  # SSL Configuration - Modern settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # HSTS - Force HTTPS for 1 year
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  root /usr/share/nginx/html;
  index index.html;

  # Enable gzip compression
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

  location ~ ^/(api|auth)/ {
    proxy_pass http://app:8005;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🔴 COOKIE SUPPORT
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
  }
  
  # Cache static assets aggressively
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
