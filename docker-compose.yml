
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # The app serves both API and static client via Express on 8005
    ports:
      - "8005:8005"
    environment:
      NODE_ENV: production
      NODE_PORT: 8005
      SERVER_URL: http://3.238.250.221
    # Provide runtime secrets/config via environment variables.
    # These values will be injected into the container's environment and used by process.env.
    env_file:
      - .env
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped
